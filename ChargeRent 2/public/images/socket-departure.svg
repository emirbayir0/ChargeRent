<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGradDep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171A"/>
      <stop offset="50%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="inletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242529"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
  </defs>

  <!-- Background / Vehicle quarter panel -->
  <rect width="800" height="600" fill="url(#panelGradDep)"/>

  <!-- Automotive body curve highlight lines -->
  <path d="M0 160 Q 400 210, 800 150" fill="none" stroke="#25262B" stroke-width="2" opacity="0.6"/>
  <path d="M0 460 Q 400 420, 800 490" fill="none" stroke="#202126" stroke-width="1.5" opacity="0.5"/>

  <!-- Charging port cavity / housing recess (Kapak açık yuva) -->
  <ellipse cx="380" cy="300" rx="190" ry="180" fill="#0A0B0D" stroke="#28292E" stroke-width="3"/>

  <!-- Open flap door swung open on the left -->
  <path d="M220 180 C 150 190, 110 260, 120 360 C 130 420, 170 440, 210 430" fill="#141518" stroke="#303136" stroke-width="2"/>
  <rect x="210" y="270" width="14" height="60" rx="4" fill="#242528"/>

  <!-- Type 2 Vehicle Port Bezel (Soket çıkarılmış hâl) -->
  <circle cx="400" cy="300" r="115" fill="url(#inletGrad)" stroke="#383940" stroke-width="3"/>
  <circle cx="400" cy="300" r="95" fill="#121316" stroke="#222327" stroke-width="2"/>

  <!-- 7-Pin Type 2 Terminal Sleeves (L1, L2, L3, N, PE, CP, PP) -->
  <!-- Top pilot pins (CP, PP) -->
  <circle cx="375" cy="245" r="10" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="375" cy="245" r="4" fill="#D1D1D6"/>
  <circle cx="425" cy="245" r="10" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="425" cy="245" r="4" fill="#D1D1D6"/>

  <!-- Middle power pins (L1, PE, L2) -->
  <circle cx="350" cy="295" r="14" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="350" cy="295" r="6" fill="#C7923E"/>
  <circle cx="400" cy="295" r="14" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="400" cy="295" r="6" fill="#30C27C"/>
  <circle cx="450" cy="295" r="14" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="450" cy="295" r="6" fill="#C7923E"/>

  <!-- Bottom power pins (L3, N) -->
  <circle cx="370" cy="345" r="14" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="370" cy="345" r="6" fill="#C7923E"/>
  <circle cx="430" cy="345" r="14" fill="#1C1D21" stroke="#3A3B42" stroke-width="2"/>
  <circle cx="430" cy="345" r="6" fill="#4A90E2"/>

  <!-- Protective Rubber Cap resting on Tether (Kauçuk toz kapağı) -->
  <path d="M480 340 Q 530 380, 540 430" fill="none" stroke="#2C2D32" stroke-width="4" stroke-linecap="round"/>
  <circle cx="545" cy="445" r="28" fill="#1C1D21" stroke="#383940" stroke-width="2"/>
  <circle cx="545" cy="445" r="20" fill="#121316"/>

  <!-- Coiled cable hanging cleanly on wall dock at right edge -->
  <g transform="translate(680, 200)">
    <!-- Wall dock hook -->
    <rect x="-10" y="0" width="30" height="70" rx="8" fill="#242528" stroke="#3A3B40" stroke-width="2"/>
    <!-- Unplugged connector resting vertically in wall dock -->
    <rect x="0" y="20" width="45" height="110" rx="12" fill="#18191C" stroke="#44464F" stroke-width="2"/>
    <!-- Hanging cable loop -->
    <path d="M20 130 C 20 250, -80 270, -80 180" fill="none" stroke="#121315" stroke-width="26" stroke-linecap="round"/>
    <path d="M20 130 C 20 250, -80 270, -80 180" fill="none" stroke="#25262B" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Complete status indicator LED (Session Finished - Solid Green/White) -->
  <circle cx="485" cy="225" r="6" fill="#30C27C"/>
  <circle cx="485" cy="225" r="12" fill="none" stroke="#30C27C" stroke-width="1.5" opacity="0.6"/>

  <!-- Photo label pill (Seans Tamamlandı) -->
  <style>
    @media (max-width: 600px) {
      .station-badge-small { display: none; }
    }
  </style>
  <g class="station-badge-small" transform="translate(40, 40)">
    <rect width="245" height="34" rx="17" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#30C27C"/>
    <text x="32" y="21" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Çıkış Fotoğrafı · Soket Ayrıldı</text>
  </g>
</svg>
