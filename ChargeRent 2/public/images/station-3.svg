<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="wallboxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28282C"/>
      <stop offset="100%" stop-color="#18181A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad3)"/>

  <!-- Underground garage ceiling beam and conduit piping -->
  <rect x="0" y="0" width="800" height="70" fill="#141416"/>
  <line x1="0" y1="70" x2="800" y2="70" stroke="#2C2C2E" stroke-width="2"/>
  
  <!-- Electrical conduit pipes from ceiling to charger -->
  <line x1="400" y1="70" x2="400" y2="150" stroke="#3A3A3C" stroke-width="8" stroke-linecap="square"/>
  <circle cx="400" cy="110" r="8" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>

  <!-- Concrete pillar in garage -->
  <rect x="260" y="70" width="280" height="430" fill="#16171A" stroke="#28292D" stroke-width="1.5"/>
  <line x1="260" y1="70" x2="260" y2="500" stroke="#3A3A3C" stroke-width="2"/>
  <line x1="540" y1="70" x2="540" y2="500" stroke="#3A3A3C" stroke-width="2"/>

  <!-- Floor line (epoxy garage floor) -->
  <line x1="0" y1="500" x2="800" y2="500" stroke="#3A3A3C" stroke-width="2"/>
  <polygon points="0,500 800,500 800,600 0,600" fill="#0C0D0F"/>
  <!-- Safety yellow parking boundary line -->
  <line x1="160" y1="500" x2="60" y2="600" stroke="#F5A623" stroke-width="6" opacity="0.6"/>
  <line x1="640" y1="500" x2="740" y2="600" stroke="#F5A623" stroke-width="6" opacity="0.6"/>

  <!-- Wallbox Unit Mounted on Pillar -->
  <rect x="330" y="150" width="140" height="220" rx="18" fill="url(#wallboxGrad3)" stroke="#3A3A3C" stroke-width="2"/>

  <!-- Front faceplate -->
  <rect x="345" y="165" width="110" height="130" rx="12" fill="#0D0E10" stroke="#2C2C2E" stroke-width="1"/>

  <!-- Dual LED status bar -->
  <rect x="365" y="185" width="70" height="6" rx="3" fill="#30C27C"/>
  <circle cx="400" cy="230" r="28" fill="#18181A" stroke="#30C27C" stroke-width="2"/>
  <path d="M397 222 L392 231 L400 231 L396 239 L406 228 L399 228 Z" fill="#30C27C"/>

  <!-- Spec text -->
  <text x="400" y="278" text-anchor="middle" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">11 kW · 3-FAZ</text>

  <!-- Coiled cable draped on lower pillar bracket -->
  <rect x="375" y="380" width="50" height="20" rx="4" fill="#242426" stroke="#3A3A3C" stroke-width="1.5"/>
  <path d="M370 370 C 320 440, 480 440, 430 370 C 430 420, 370 420, 370 370" fill="none" stroke="#202022" stroke-width="12" stroke-linecap="round"/>
  <path d="M370 370 C 320 440, 480 440, 430 370 C 430 420, 370 420, 370 370" fill="none" stroke="#2C2C2E" stroke-width="7" stroke-linecap="round"/>

  <!-- Floor glow reflection -->
  <ellipse cx="400" cy="520" rx="70" ry="10" fill="#30C27C" opacity="0.06"/>

  <!-- Station Badge -->
  <style>
    @media (max-width: 600px) {
      .station-badge-small { display: none; }
    }
  </style>
  <g class="station-badge-small" transform="translate(40, 40)">
    <rect width="200" height="34" rx="17" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#30C27C"/>
    <text x="32" y="21" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Örnek · 11 kW Garaj</text>
  </g>
</svg>
