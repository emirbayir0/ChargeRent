<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B1E"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323338"/>
      <stop offset="50%" stop-color="#242529"/>
      <stop offset="100%" stop-color="#18191C"/>
    </linearGradient>
    <filter id="greenGlowRing" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background / Vehicle quarter panel sheet metal -->
  <rect width="800" height="600" fill="url(#panelGrad)"/>

  <!-- Subtle automotive body contour reflection lines (markasız araç çamurluk kıvrımı) -->
  <path d="M0 180 Q 400 240, 800 160" fill="none" stroke="#2C2D32" stroke-width="2" opacity="0.6"/>
  <path d="M0 480 Q 400 440, 800 520" fill="none" stroke="#25262B" stroke-width="1.5" opacity="0.5"/>

  <!-- Open charging port door recess (Kapak açık yuva) -->
  <ellipse cx="440" cy="300" rx="200" ry="190" fill="#0C0D0F" stroke="#2A2B30" stroke-width="3"/>
  
  <!-- Hinge and open flap edge on the right -->
  <path d="M600 160 C 660 170, 710 240, 700 350 C 690 420, 640 450, 590 440" fill="#18191D" stroke="#35363C" stroke-width="2"/>
  <rect x="585" y="270" width="14" height="60" rx="4" fill="#2A2B30"/>

  <!-- Circular LED light ring around vehicle inlet (Canlı şarj ışık halkası) -->
  <circle cx="420" cy="300" r="130" fill="none" stroke="#16171A" stroke-width="14"/>
  <circle cx="420" cy="300" r="130" fill="none" stroke="#30C27C" stroke-width="10" stroke-dasharray="720 100" filter="url(#greenGlowRing)"/>

  <!-- Female inlet housing on car -->
  <circle cx="420" cy="300" r="105" fill="#141518" stroke="#2C2E33" stroke-width="3"/>

  <!-- Heavy Type 2 Charging Plug Body (Giriş: Takılı soket) -->
  <!-- Plug handle angled entering into the socket -->
  <g transform="translate(420, 300) rotate(-15) translate(-420, -300)">
    <!-- Plug collar mating into car socket -->
    <rect x="360" y="220" width="90" height="160" rx="20" fill="#1E1F24" stroke="#3E4048" stroke-width="2"/>
    
    <!-- Main ergonomic handle body extending to the left -->
    <path d="M370 200 L 220 220 C 180 230, 160 270, 160 300 C 160 330, 180 370, 220 380 L 370 400 Z" fill="url(#plugGrad)" stroke="#4A4C55" stroke-width="2"/>
    
    <!-- Grip ridges on handle -->
    <rect x="220" y="250" width="10" height="100" rx="4" fill="#16171A"/>
    <rect x="240" y="250" width="10" height="100" rx="4" fill="#16171A"/>
    <rect x="260" y="250" width="10" height="100" rx="4" fill="#16171A"/>
    
    <!-- Lock latch button on top of plug -->
    <rect x="300" y="200" width="50" height="14" rx="5" fill="#30C27C" filter="url(#greenGlowRing)"/>
    
    <!-- Thick flexible black cable exiting plug rear -->
    <path d="M160 300 C 100 300, 40 380, 0 420" fill="none" stroke="#111214" stroke-width="44" stroke-linecap="round"/>
    <path d="M160 300 C 100 300, 40 380, 0 420" fill="none" stroke="#242529" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Soft green ambient reflection on car panel -->
  <ellipse cx="440" cy="300" rx="170" ry="160" fill="#30C27C" opacity="0.07"/>

  <!-- Photo label pill (Seans Başlangıcı) -->
  <style>
    @media (max-width: 600px) {
      .station-badge-small { display: none; }
    }
  </style>
  <g class="station-badge-small" transform="translate(40, 40)">
    <rect width="230" height="34" rx="17" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#30C27C"/>
    <text x="32" y="21" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Giriş Fotoğrafı · Soket Takıldı</text>
  </g>
</svg>
