<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#090A0C"/>
    </linearGradient>
    <linearGradient id="dualPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242529"/>
      <stop offset="50%" stop-color="#1E1F23"/>
      <stop offset="100%" stop-color="#151619"/>
    </linearGradient>
    <filter id="glowGreen5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad5)"/>

  <!-- Garage ceiling and floor lines -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#25262B" stroke-width="3"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#2C2E33" stroke-width="2"/>
  <rect x="0" y="520" width="800" height="80" fill="#0C0D0F"/>

  <!-- Parking demarcations on floor -->
  <line x1="220" y1="520" x2="120" y2="600" stroke="#3A3C42" stroke-width="5"/>
  <line x1="580" y1="520" x2="680" y2="600" stroke="#3A3C42" stroke-width="5"/>

  <!-- Dual-Port Heavy Duty Commercial / Residential Pillar Body -->
  <rect x="330" y="110" width="140" height="410" rx="14" fill="url(#dualPillar)" stroke="#3A3C42" stroke-width="2"/>

  <!-- Top Display Screen Area -->
  <rect x="350" y="130" width="100" height="60" rx="8" fill="#0B0C0E" stroke="#28292E" stroke-width="1.5"/>
  <rect x="365" y="145" width="70" height="4" rx="2" fill="#30C27C" filter="url(#glowGreen5)"/>
  <text x="400" y="172" text-anchor="middle" fill="#30C27C" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12" font-weight="700">22 kW · 32A</text>

  <!-- Left Charging Socket Area (Port 1) -->
  <g transform="translate(345, 230)">
    <rect width="45" height="75" rx="10" fill="#141518" stroke="#2C2E33" stroke-width="1.5"/>
    <circle cx="22" cy="38" r="15" fill="#0E0F12" stroke="#30C27C" stroke-width="2"/>
    <circle cx="22" cy="38" r="5" fill="#30C27C"/>
    <text x="22" y="66" text-anchor="middle" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">SOKET 1</text>
  </g>

  <!-- Right Charging Socket Area (Port 2) -->
  <g transform="translate(410, 230)">
    <rect width="45" height="75" rx="10" fill="#141518" stroke="#2C2E33" stroke-width="1.5"/>
    <circle cx="22" cy="38" r="15" fill="#0E0F12" stroke="#30C27C" stroke-width="2"/>
    <circle cx="22" cy="38" r="5" fill="#30C27C"/>
    <text x="22" y="66" text-anchor="middle" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">SOKET 2</text>
  </g>

  <!-- Mid Divider & Status Bar -->
  <line x1="345" y1="330" x2="455" y2="330" stroke="#2C2E33" stroke-width="1.5"/>
  <rect x="360" y="350" width="80" height="20" rx="10" fill="#141518" stroke="#2C2E33" stroke-width="1"/>
  <text x="400" y="364" text-anchor="middle" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">OCPP 2.0.1</text>

  <!-- Floor Pedestal Plate -->
  <polygon points="310,520 490,520 510,540 290,540" fill="#1E2024" stroke="#3A3C42" stroke-width="1.5"/>

  <!-- Station Badge -->
  <style>
    @media (max-width: 600px) {
      .station-badge-small { display: none; }
    }
  </style>
  <g class="station-badge-small" transform="translate(40, 40)">
    <rect width="210" height="34" rx="17" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#30C27C"/>
    <text x="32" y="21" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Örnek · 22 kW Sütun</text>
  </g>
</svg>
