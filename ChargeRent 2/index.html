<body class="bg-black text-[#F5F5F7] font-sans antialiased selection:bg-[#F5F5F7] selection:text-black min-h-screen overflow-x-hidden">
  <div id="error-fallback" style="display:none; color: #ff6b6b; padding: 24px; font-family: -apple-system, sans-serif; background: #1c1c1e; border: 1px solid #ff4444; border-radius: 12px; margin: 24px;"></div>
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        console.error('App runtime error:', e);
        return;
      }
      var box = document.getElementById('error-fallback');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<h3 style="margin-top:0; color:#ff4444;">Yükleme Hatası</h3>' +
          '<p style="color:#f5f5f7; font-family: monospace;">' + (e.message || e) + '</p>' +
          (e.filename ? '<p style="color:#a1a1a6; font-size:12px;">Dosya: ' + e.filename + ' (' + e.lineno + ':' + e.colno + ')</p>' : '');
      }
    });
  </script>

  <div id="root"></div>

  <!-- App Code Script -->
  <script type="text/babel" src="./src/App.jsx?v=31"></script>
</body>
